<body data-book="elementary" data-page="stamps">
<main class="wrap">
  <section class="book-hero" style="grid-template-columns:1fr">
    <div>
      <p class="kicker">초등 · 하루의 수학과 과학</p>
      <h1>도장 수첩</h1>
      <p class="lead">장마다 확인 문제 세 개를 다 풀면 도장이 하나씩 찍혀요. 몇 번을 다시 풀어도 괜찮아요.</p>
      <p class="stamp-count" id="count" aria-live="polite"></p>
    </div>
  </section>
  <div class="stampbook" id="book"></div>
  <p class="small">도장은 이 기기의 브라우저에만 저장돼요. 다른 기기와 나누지 않고, 저장이 막힌 브라우저(사생활 보호 창 등)에서는 창을 닫으면 사라져요.</p>
  <div class="btn-row" style="justify-content:flex-start"><button class="btn" type="button" id="clear">도장 모두 지우기</button></div>
</main>
<script>
SB.ready(() => {
  const box = document.getElementById('book');
  function draw() {
    const got = SB.stamps();
    const list = SB.book.chapters;
    box.innerHTML = list.map((c) => {
      const s = got[c.slug];
      const num = String(c.num).padStart(2, '0');
      const inner = s ? SB.stampFor(c.slug, s.date, 'still') : `<span class="empty">${num}</span>`;
      const cap = `<span class="cap">${SB.esc(c.title)}</span>` + (s ? `<span class="date">${s.date}</span>` : (c.ready ? '' : '<span class="date">준비 중</span>'));
      return c.ready ? `<a class="slot" href="chapters/${c.slug}.html">${inner}${cap}</a>` : `<div class="slot off">${inner}${cap}</div>`;
    }).join('');
    const n = list.filter((c) => got[c.slug]).length;
    document.getElementById('count').textContent = `${list.length}개 중 ${n}개를 모았어요`;
  }
  draw();
  document.getElementById('clear').addEventListener('click', () => {
    if (!confirm('모은 도장을 모두 지울까요?')) return;
    SB.store.remove('stamps:' + SB.book.id);
    draw();
  });
});
</script>
</body>
